name: Test labeler sync-labels and dot inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config with dotfile patterns
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          github-config:
            - changed-files:
              - any-glob-to-any-file:
                - '.github/**'
          ci:
            - changed-files:
              - any-glob-to-any-file:
                - '.github/workflows/**'
          dependencies:
            - changed-files:
              - any-glob-to-any-file:
                - 'package.json'
                - 'package-lock.json'
          EOF

      - name: Run labeler with sync-labels enabled and dot enabled
        id: labeler
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
        continue-on-error: true

      - name: Assert action ran with sync-labels and dot inputs
        env:
          NEW_LABELS: ${{ steps.labeler.outputs.new-labels }}
          ALL_LABELS: ${{ steps.labeler.outputs.all-labels }}
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new-labels: $NEW_LABELS"
          echo "all-labels: $ALL_LABELS"
          # The action should produce a definitive outcome (success or failure).
          # We're testing that sync-labels=true and dot=true inputs are accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sync-labels=true and dot=true"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test labeler with dot=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/5/merge
      GITHUB_HEAD_REF: chore/update-ci
      GITHUB_BASE_REF: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          ci:
            - changed-files:
              - any-glob-to-any-file: ['.github/workflows/**']
          docs:
            - changed-files:
              - any-glob-to-any-file: ['docs/**', 'README.md']
          EOF

      - id: labeler
        name: Run labeler with dot=false
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: false
        continue-on-error: true

      - name: Assert action ran with dot=false
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with dot=false, outcome '$OUTCOME'"

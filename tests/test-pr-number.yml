name: Test labeler with pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler configuration
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: ['docs/**', '*.md']
          source:
            - changed-files:
              - any-glob-to-any-file: ['src/**']
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
          pr-number: 42

      - name: Assert action ran with pr-number
        run: |
          echo "Action completed with pr-number input"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step with pr-number executed"

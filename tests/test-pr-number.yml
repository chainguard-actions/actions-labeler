name: Test labeler with pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: ['docs/**', '*.md']
          source:
            - changed-files:
              - any-glob-to-any-file: ['src/**']
          EOF

      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
          pr-number: 42
        continue-on-error: true

      - name: Assert action ran with pr-number input
        run: |
          echo "Action completed with pr-number=42 (may have errored due to no real GitHub context)"
          echo "new-labels: ${{ steps.action.outputs.new-labels }}"
          echo "all-labels: ${{ steps.action.outputs.all-labels }}"
          echo "PASS: action step with pr-number input executed"

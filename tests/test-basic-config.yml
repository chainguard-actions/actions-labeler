name: Test basic labeler config loading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler configuration
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
          - changed-files:
            - any-glob-to-any-file: 'docs/**'
          source:
          - changed-files:
            - any-glob-to-any-file: 'src/**'
          EOF

      - name: Run labeler action (expect API failure, not config failure)
        id: labeler
        uses: .
        continue-on-error: true
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          pr-number: 1

      - name: Assert action ran (config was loaded)
        run: |
          # The action should not be skipped - it should have run (success or failure)
          # With a fake token, getPullRequests catches the API error and skips the PR,
          # so the action exits successfully.
          echo "Labeler action outcome: ${{ steps.labeler.outcome }}"
          if [ "${{ steps.labeler.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.labeler.outcome }})"

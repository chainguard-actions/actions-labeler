name: Test basic labeler config reading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file:
                - '**/*.md'
                - 'docs/**'
          tests:
            - changed-files:
              - any-glob-to-any-file:
                - 'tests/**'
          EOF

      - name: Run labeler action (no PR number - expect graceful exit or API error)
        id: labeler
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
        continue-on-error: true

      - name: Assert action ran (outputs may be empty when no PR)
        env:
          NEW_LABELS: ${{ steps.labeler.outputs.new-labels }}
          ALL_LABELS: ${{ steps.labeler.outputs.all-labels }}
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new-labels: $NEW_LABELS"
          echo "all-labels: $ALL_LABELS"
          # The action should either succeed with empty labels or fail gracefully
          # when there's no PR context. Both outcomes are acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test labeler with dot input disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler configuration with dot-prefixed paths
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          github-config:
          - changed-files:
            - any-glob-to-any-file: '.github/**'
          source:
          - changed-files:
            - any-glob-to-any-file: 'src/**'
          EOF

      - name: Run labeler action with dot=false
        id: labeler
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          dot: false

      - name: Assert action ran with dot=false input
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no-op) or fail gracefully when there's no PR context.
          # Either outcome is acceptable — what we're testing is that dot=false input is accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' with dot=false"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

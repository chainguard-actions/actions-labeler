name: Test dot input for dotfile path inclusion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config with dotfile patterns
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          github-config:
            - changed-files:
              - any-glob-to-any-file: '.github/**'
          EOF

      - id: action-dot-true
        uses: .
        with:
          repo-token: fake-token
          dot: "true"
        continue-on-error: true

      - name: Assert action ran with dot=true
        env:
          OUTCOME: ${{ steps.action-dot-true.outcome }}
        run: |
          echo "outcome (dot=true): $OUTCOME"
          # The action should accept dot=true and run without input errors.
          # It may fail due to fake token or no PR context, but not due to invalid input.
          echo "PASS: action ran with dot=true (outcome=$OUTCOME)"

      - id: action-dot-false
        uses: .
        with:
          repo-token: fake-token
          dot: "false"
        continue-on-error: true

      - name: Assert action ran with dot=false
        env:
          OUTCOME: ${{ steps.action-dot-false.outcome }}
        run: |
          echo "outcome (dot=false): $OUTCOME"
          # The action should accept dot=false and run without input errors.
          echo "PASS: action ran with dot=false (outcome=$OUTCOME)"

name: Test basic labeler usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up labeler config
        run: |
          mkdir -p .github
          cp $GITHUB_WORKSPACE/actions/hardened/actions--labeler/v6.0.1/tests/fixtures/labeler.yml .github/labeler.yml

      - id: action
        uses: .
        with:
          repo-token: fake-token
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to fake token, which is expected in test)"
          echo "PASS: action step was reached and executed"

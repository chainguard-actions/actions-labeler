name: Test basic labeler invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: ['docs/**', '*.md']
          source:
            - changed-files:
              - any-glob-to-any-file: ['src/**']
          EOF

      - name: Run labeler action (expect API error, not config error)
        id: labeler
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          pr-number: "1"
        continue-on-error: true

      - name: Assert action ran (config loaded, API call attempted)
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an API error
          # It should NOT fail with a config/setup error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and attempted to execute"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

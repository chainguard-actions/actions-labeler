name: Test labeler - multiple invalid PR numbers provided
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: 'docs/**'
          source:
            - changed-files:
              - any-glob-to-any-file: 'src/**'
          EOF

      # When multiple invalid pr-numbers are provided (negative, zero, non-numeric),
      # the action should warn about each invalid number and exit gracefully
      # without setting any outputs and without failing the step
      - id: labeler
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          pr-number: |
            -1
            0
            abc

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (all invalid PR numbers = graceful exit with warnings)"
          echo "PASS"

      - name: Assert new-labels output is empty
        env:
          NEW_LABELS: ${{ steps.labeler.outputs.new-labels }}
        run: |
          echo "new-labels: '$NEW_LABELS'"
          if [ -n "$NEW_LABELS" ]; then
            echo "FAIL: expected new-labels to be empty when all PR numbers are invalid, got: '$NEW_LABELS'"
            exit 1
          fi
          echo "PASS: new-labels is empty as expected"

      - name: Assert all-labels output is empty
        env:
          ALL_LABELS: ${{ steps.labeler.outputs.all-labels }}
        run: |
          echo "all-labels: '$ALL_LABELS'"
          if [ -n "$ALL_LABELS" ]; then
            echo "FAIL: expected all-labels to be empty when all PR numbers are invalid, got: '$ALL_LABELS'"
            exit 1
          fi
          echo "PASS: all-labels is empty as expected"

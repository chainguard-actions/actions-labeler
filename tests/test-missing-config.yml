name: Test labeler with missing configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run labeler action with missing config
        id: labeler
        uses: .
        continue-on-error: true
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/nonexistent-labeler.yml
          pr-number: 1

      - name: Assert action ran (not skipped)
        run: |
          # With a fake token, getPullRequests catches the API error and skips the PR.
          # The config file is never read (getLabelConfigs is inside the PR loop).
          # So the action exits successfully even with a missing config file.
          echo "Labeler action outcome: ${{ steps.labeler.outcome }}"
          if [ "${{ steps.labeler.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and handled missing config gracefully (outcome: ${{ steps.labeler.outcome }})"

name: Test labeler with dot paths option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config with dot paths
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          github-config:
            - changed-files:
              - any-glob-to-any-file: ['.github/**']
          EOF

      - name: Run labeler with dot=true (default)
        id: labeler-dot-true
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          dot: "true"
          pr-number: "1"
        continue-on-error: true

      - name: Assert action ran with dot=true
        env:
          OUTCOME: ${{ steps.labeler-dot-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with dot=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Run labeler with dot=false
        id: labeler-dot-false
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/labeler.yml
          dot: "false"
          pr-number: "1"
        continue-on-error: true

      - name: Assert action ran with dot=false
        env:
          OUTCOME: ${{ steps.labeler-dot-false.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with dot=false"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test pr-number input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: 'docs/**'
          source:
            - changed-files:
              - any-glob-to-any-file: 'src/**'
          EOF

      - id: action
        uses: .
        with:
          repo-token: fake-token
          pr-number: "42"
        continue-on-error: true

      - name: Assert action attempted to process PR number 42
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the pr-number input and attempt to process it.
          # It will fail when trying to make GitHub API calls with a fake token,
          # but it should NOT fail due to missing/invalid PR number.
          # A failure here means the action tried to call the API (expected behavior).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action attempted API call for PR #42 (failed due to fake token as expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          documentation:
            - changed-files:
              - any-glob-to-any-file: ['docs/**']
          EOF

      - name: Run action with pr-number input
        id: labeler
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          pr-number: 1

      - name: Assert pr-number input was accepted
        run: |
          echo "outcome: ${{ steps.labeler.outcome }}"
          # The action may fail if PR #1 doesn't exist in the repo,
          # but the important thing is that the pr-number input is exercised.
          # We accept both success and failure outcomes here since the action
          # behavior depends on whether PR #1 exists in the real repo.
          if [ "${{ steps.labeler.outcome }}" = "success" ] || [ "${{ steps.labeler.outcome }}" = "failure" ]; then
            echo "PASS: action ran with pr-number input"
          else
            echo "FAIL: unexpected outcome: ${{ steps.labeler.outcome }}"
            exit 1
          fi

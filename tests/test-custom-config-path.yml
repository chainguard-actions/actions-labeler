name: Test labeler with custom configuration path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom labeler configuration
        run: |
          mkdir -p config
          cat > config/my-labeler.yml << 'EOF'
          feature:
          - head-branch: ['^feature', 'feature']
          bugfix:
          - head-branch: ['^fix', 'fix', '^bug', 'bug']
          release:
          - base-branch: 'main'
          EOF

      - name: Run labeler action with custom config path
        id: labeler
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: config/my-labeler.yml

      - name: Assert action ran with custom config path
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no-op) or fail gracefully when there's no PR context.
          # Either outcome is acceptable — what we're testing is that it reads the custom config.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using custom config path"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
